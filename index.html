<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho tệp</title>
<style>
:root{--bg:#eef3f9;--panel:#fff;--tx:#14202e;--mu:#667689;--ac:#1479ff;--ac2:#e6f0ff;--bd:#dbe4ef;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0d141c;--panel:#16212d;--tx:#e8eef5;--mu:#8da0b5;--ac:#4a9bff;--ac2:#1b2f48;--bd:#243445}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:160px;max-width:420px;margin-left:auto}
.search input{width:100%;padding:9px 14px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);color:var(--tx);font:inherit}
.search input:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:18px 20px 60px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:var(--mu);margin-bottom:14px}
.crumbs a{color:var(--ac);text-decoration:none;padding:2px 6px;border-radius:6px}
.crumbs a:hover{background:var(--ac2)}
.list{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--bd);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--ac2)}
.ic{font-size:26px;width:34px;text-align:center;flex:none}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sz{color:var(--mu);font-size:13px;flex:none}
.dl{flex:none;border:0;background:var(--ac2);color:var(--ac);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.dl:hover{background:var(--ac);color:#fff}
.up{border:0;background:var(--ac);color:#fff;border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
.up:hover{filter:brightness(1.1)}
body.drag main{outline:3px dashed var(--ac);outline-offset:-10px;border-radius:var(--r)}
.msg{padding:40px 20px;text-align:center;color:var(--mu)}
.msg b{display:block;color:var(--tx);margin-bottom:4px;font-size:16px}
.hint{color:var(--mu);font-size:13px;margin-top:12px;text-align:center}
#modal{position:fixed;inset:0;background:rgba(5,10,16,.72);display:none;z-index:20;padding:3vh 3vw}
#modal.on{display:flex}
.box{margin:auto;background:var(--panel);border-radius:var(--r);width:100%;max-width:1000px;height:100%;max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd)}
.bar .nm{font-weight:600}
.x{border:0;background:var(--bg);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.view{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.view img,.view video{max-width:100%;max-height:100%}
.view iframe{width:100%;height:100%;border:0;background:#fff}
.view pre{margin:0;padding:16px;width:100%;height:100%;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;align-self:flex-start}
.view audio{width:min(480px,90%)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:40;width:min(420px,92vw)}
#toast div{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
</style>
</head>
<body>
<header>
  <h1><span>☁️</span><span id="title"></span></h1>
  <div class="search"><input id="q" type="search" placeholder="Tìm tệp trong thư mục này" aria-label="Tìm tệp"></div>
  <button class="up" id="upbtn">Tải lên</button>
  <input type="file" id="upin" multiple hidden>
</header>
<main>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="list" id="list"></div>
  <div class="hint">Kéo thả tệp vào trang để tải lên. Mỗi tệp tối đa 20 MB.</div>
</main>
<div id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <div class="bar"><span class="nm" id="mname"></span><button class="dl" id="mdl">Tải về</button><button class="x" id="mx" aria-label="Đóng">✕</button></div>
    <div class="view" id="view"></div>
  </div>
</div>
<div id="toast" aria-live="polite"></div>

<script>
/* ====== CẤU HÌNH ======
   Điền 2 giá trị lấy từ Supabase (Project Settings → API):
   supabaseUrl: Project URL, ví dụ https://abcdxyz.supabase.co
   anonKey:     khóa "anon public" (khóa này được thiết kế để công khai, dán vào đây là an toàn) */
const CONFIG = { title: "Kho tệp", supabaseUrl: "", anonKey: "", bucket: "files" };

const $ = id => document.getElementById(id);
$("title").textContent = CONFIG.title; document.title = CONFIG.title;
const MAX = 20 * 1048576;
const BLOCKED = ["html","htm","xhtml","svg","js","mjs","php","exe","msi","bat","cmd","com","scr","ps1","sh","jar","apk","dll","vbs"];
const TYPES = {
  image:["jpg","jpeg","png","gif","webp","bmp","avif"],
  video:["mp4","webm","mov","m4v","ogv"],
  audio:["mp3","wav","ogg","m4a","flac","aac"],
  pdf:["pdf"],
  text:["txt","md","json","csv","log","css","xml","yml","yaml","py","cpp","c","h","java","cs","ini","sql"]
};
const ICON = {image:"🖼️",video:"🎬",audio:"🎵",pdf:"📕",text:"📄",other:"📦",dir:"📁"};
const ext = n => (n.split(".").pop() || "").toLowerCase();
const kind = n => Object.keys(TYPES).find(k => TYPES[k].includes(ext(n))) || "other";
const fmt = b => b < 1024 ? b + " B" : b < 1048576 ? (b/1024).toFixed(1) + " KB" : (b/1048576).toFixed(1) + " MB";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const enc = p => p.split("/").map(encodeURIComponent).join("/");

const API = CONFIG.supabaseUrl.replace(/\/$/, "") + "/storage/v1/object";
const AUTH = { apikey: CONFIG.anonKey, Authorization: "Bearer " + CONFIG.anonKey };
const pubUrl = p => `${API}/public/${CONFIG.bucket}/${enc(p)}`;

let items = [];
const sub = () => decodeURIComponent(location.hash.replace(/^#\/?/, "")).replace(/\/+$/, "");

function toast(t, keep) {
  const d = document.createElement("div"); d.textContent = t; $("toast").appendChild(d);
  if (!keep) setTimeout(() => d.remove(), 5000);
  return d;
}
function msg(t, d) { $("list").innerHTML = `<div class="msg"><b>${t}</b>${d}</div>`; }

async function load() {
  const s = sub();
  renderCrumbs(s); $("q").value = "";
  if (!CONFIG.supabaseUrl || !CONFIG.anonKey) return msg("Chưa cấu hình", "Điền supabaseUrl và anonKey trong phần CONFIG ở đầu file index.html.");
  $("list").innerHTML = '<div class="msg">Đang tải…</div>';
  try {
    const r = await fetch(`${API}/list/${CONFIG.bucket}`, {
      method: "POST", headers: { ...AUTH, "Content-Type": "application/json" },
      body: JSON.stringify({ prefix: s, limit: 1000, offset: 0, sortBy: { column: "name", order: "asc" } })
    });
    if (!r.ok) throw 0;
    items = (await r.json()).filter(f => f.name !== ".emptyFolderPlaceholder").map(f => {
      const path = (s ? s + "/" : "") + f.name;
      return { name: f.name, type: f.id ? "file" : "dir", size: (f.metadata && f.metadata.size) || 0, download_url: pubUrl(path) };
    }).sort((a, b) => (a.type === "dir" ? 0 : 1) - (b.type === "dir" ? 0 : 1) || a.name.localeCompare(b.name, "vi", { numeric: true }));
    render();
  } catch (e) { msg("Không tải được danh sách", "Kiểm tra supabaseUrl, anonKey và đã chạy đoạn SQL cấp quyền chưa."); }
}

function renderCrumbs(s) {
  const parts = s ? s.split("/") : [];
  let acc = "", h = `<a href="#/">${esc(CONFIG.title)}</a>`;
  parts.forEach(p => { acc += (acc ? "/" : "") + p; h += ` › <a href="#/${enc(acc)}">${esc(p)}</a>`; });
  $("crumbs").innerHTML = h;
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const rows = items.filter(f => f.name.toLowerCase().includes(q));
  if (!rows.length) return msg(q ? "Không có tệp khớp" : "Chưa có tệp nào", q ? "Thử từ khóa khác." : "Bấm Tải lên hoặc kéo thả tệp vào đây.");
  $("list").innerHTML = rows.map(f => {
    const dir = f.type === "dir", k = dir ? "dir" : kind(f.name);
    return `<div class="item" tabindex="0" data-n="${esc(f.name)}"><span class="ic">${ICON[k]}</span><span class="nm">${esc(f.name)}</span>` +
      (dir ? "" : `<span class="sz">${fmt(f.size)}</span><button class="dl" data-d="1">Tải về</button>`) + `</div>`;
  }).join("");
}

$("list").addEventListener("click", e => {
  const el = e.target.closest(".item"); if (!el) return;
  const f = items.find(x => x.name === el.dataset.n);
  if (e.target.closest("[data-d]")) { e.stopPropagation(); return download(f, e.target.closest("[data-d]")); }
  open(f);
});
$("list").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList.contains("item")) e.target.click(); });
$("q").addEventListener("input", render);
addEventListener("hashchange", load);

async function download(f, btn) {
  const old = btn ? btn.textContent : "";
  if (btn) btn.textContent = "Đang tải…";
  try {
    const blob = await (await fetch(f.download_url)).blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { window.open(f.download_url, "_blank"); }
  if (btn) btn.textContent = old;
}

let cur = null, blobUrl = null;
async function open(f) {
  if (f.type === "dir") { location.hash = "#/" + enc([sub(), f.name].filter(Boolean).join("/")); return; }
  cur = f; const k = kind(f.name), v = $("view");
  $("mname").textContent = f.name; v.innerHTML = '<div class="msg">Đang mở…</div>';
  $("modal").classList.add("on");
  try {
    if (k === "image") v.innerHTML = `<img src="${f.download_url}" alt="${esc(f.name)}">`;
    else if (k === "video") v.innerHTML = `<video src="${f.download_url}" controls autoplay></video>`;
    else if (k === "audio") v.innerHTML = `<audio src="${f.download_url}" controls autoplay></audio>`;
    else if (k === "pdf") {
      const b = await (await fetch(f.download_url)).blob();
      blobUrl = URL.createObjectURL(new Blob([b], { type: "application/pdf" }));
      v.innerHTML = `<iframe src="${blobUrl}" title="${esc(f.name)}"></iframe>`;
    } else if (k === "text") {
      if (f.size > 1048576) throw 0;
      v.innerHTML = `<pre>${esc(await (await fetch(f.download_url)).text())}</pre>`;
    } else v.innerHTML = '<div class="msg"><b>Không xem trước được loại tệp này</b>Bấm “Tải về” để lưu vào máy.</div>';
  } catch (e) { v.innerHTML = '<div class="msg"><b>Không mở được tệp</b>Bấm “Tải về” để lưu vào máy.</div>'; }
}
function close() {
  $("modal").classList.remove("on"); $("view").innerHTML = "";
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
}
$("mx").onclick = close;
$("mdl").onclick = e => cur && download(cur, e.target);
$("modal").addEventListener("click", e => { if (e.target.id === "modal") close(); });
addEventListener("keydown", e => { if (e.key === "Escape") close(); });

/* ====== TẢI LÊN ======
   Tên tệp được đổi sang chữ không dấu (a-z, 0-9, . _ -) vì Supabase chỉ chấp nhận ký tự an toàn. */
const clean = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").replace(/[^A-Za-z0-9._-]+/g, "_").replace(/^_+|_+$/g, "");
function safeName(n) {
  const i = n.lastIndexOf(".");
  const base = i > 0 ? n.slice(0, i) : n, ex = i > 0 ? n.slice(i) : "";
  return (clean(base) || "tep") + clean(ex);
}

async function uploadFiles(files) {
  files = [...files];
  if (!files.length) return;
  if (!CONFIG.supabaseUrl || !CONFIG.anonKey) return toast("Chưa cấu hình Supabase trong CONFIG.");
  let done = 0;
  for (const f of files) {
    if (f.size > MAX) { toast(`${f.name}: lớn hơn 20 MB nên không tải lên được`); continue; }
    if (BLOCKED.includes(ext(f.name))) { toast(`${f.name}: loại tệp này không được phép tải lên`); continue; }
    if (!f.size) { toast(`${f.name}: tệp trống`); continue; }
    const t = toast(`Đang tải lên ${f.name}…`, true);
    const first = safeName(f.name);
    let name = first, n = 0;
    try {
      for (;;) { /* không ghi đè: nếu trùng tên thì thêm _1, _2… */
        const path = (sub() ? sub() + "/" : "") + name;
        const r = await fetch(`${API}/${CONFIG.bucket}/${enc(path)}`, {
          method: "POST", body: f,
          headers: { ...AUTH, "Content-Type": f.type || "application/octet-stream", "x-upsert": "false", "cache-control": "max-age=3600" }
        });
        if (r.ok) break;
        const j = await r.json().catch(() => ({}));
        if (j.error === "Duplicate" || String(j.statusCode) === "409" || r.status === 409) {
          if (++n > 50) throw new Error("Quá nhiều tệp trùng tên");
          name = first.replace(/(\.[^.]*)?$/, `_${n}$1`); continue;
        }
        if (r.status === 413) throw new Error(`${f.name}: lớn hơn giới hạn của kho`);
        if (r.status === 400 || r.status === 401 || r.status === 403) throw new Error("Kho chưa cấp quyền tải lên, hãy chạy đoạn SQL thiết lập.");
        throw new Error(`Không tải lên được ${f.name}`);
      }
      t.textContent = `Đã tải lên ${name}`; setTimeout(() => t.remove(), 4000); done++;
    } catch (e) { t.textContent = e.message || `Không tải lên được ${f.name}`; }
  }
  if (done) load();
}
$("upbtn").onclick = () => $("upin").click();
$("upin").onchange = e => { uploadFiles(e.target.files); e.target.value = ""; };
let dragN = 0;
addEventListener("dragenter", e => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) { dragN++; document.body.classList.add("drag"); } });
addEventListener("dragleave", () => { if (--dragN <= 0) { dragN = 0; document.body.classList.remove("drag"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); dragN = 0; document.body.classList.remove("drag"); if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });

load();
</script>
</body>
</html>
