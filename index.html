<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho tệp</title>
<style>
:root{--bg:#eef3f9;--panel:#fff;--tx:#14202e;--mu:#667689;--ac:#1479ff;--ac2:#e6f0ff;--bd:#dbe4ef;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#0d141c;--panel:#16212d;--tx:#e8eef5;--mu:#8da0b5;--ac:#4a9bff;--ac2:#1b2f48;--bd:#243445}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:160px;max-width:420px;margin-left:auto}
.search input{width:100%;padding:9px 14px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);color:var(--tx);font:inherit}
.search input:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:18px 20px 60px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:var(--mu);margin-bottom:14px}
.crumbs a{color:var(--ac);text-decoration:none;padding:2px 6px;border-radius:6px}
.crumbs a:hover{background:var(--ac2)}
.list{background:var(--panel);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--bd);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover{background:var(--ac2)}
.ic{font-size:26px;width:34px;text-align:center;flex:none}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sz{color:var(--mu);font-size:13px;flex:none}
.dl{flex:none;border:0;background:var(--ac2);color:var(--ac);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.dl:hover{background:var(--ac);color:#fff}
.up{border:0;background:var(--ac);color:#fff;border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
.up:hover{filter:brightness(1.1)}
body.drag main{outline:3px dashed var(--ac);outline-offset:-10px;border-radius:var(--r)}
.msg{padding:40px 20px;text-align:center;color:var(--mu)}
.msg b{display:block;color:var(--tx);margin-bottom:4px;font-size:16px}
.hint{color:var(--mu);font-size:13px;margin-top:12px;text-align:center}
#modal{position:fixed;inset:0;background:#0a1018;display:none;z-index:20}
#modal.on{display:flex}
.box{background:var(--panel);width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--bd)}
.tools{display:flex;gap:6px;align-items:center}
.tools[hidden]{display:none}
.bar .nm{font-weight:600}
.x{border:0;background:var(--bg);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.view{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.view{position:relative}
.view.img{overflow:hidden;background:#05090e}
.view img{max-width:100%;max-height:100%;transform-origin:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none}
.view video{width:100%;height:100%;object-fit:contain;background:#000}
.view iframe{width:100%;height:100%;border:0;background:#fff}
.view pre{margin:0;padding:16px;width:100%;height:100%;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;align-self:flex-start}
.view audio{width:min(480px,90%)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:40;width:min(420px,92vw)}
#toast div{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.del{background:color-mix(in srgb,#e5484d 14%,transparent);color:#e5484d}
.del:hover{background:#e5484d;color:#fff}
.over{background:var(--ac2);outline:2px dashed var(--ac);outline-offset:-3px}
.crumbs a.over{border-radius:6px}
.ov{position:fixed;inset:0;background:rgba(5,10,16,.72);display:none;z-index:30;padding:3vh 3vw}
.ov.on{display:flex}
.dbox{margin:auto;background:var(--panel);border-radius:var(--r);padding:22px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.dbox h2{margin:0 0 6px;font-size:17px}
.dbox p{margin:0 0 12px;color:var(--mu);font-size:13px}
.dbox input{width:100%;padding:10px 12px;margin-bottom:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.er{color:#e5484d;font-size:13px;min-height:18px}
.dbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.dbtn .x{width:auto;border-radius:999px;padding:0 16px;font-size:14px}
.mvb{display:block;width:100%;text-align:left;border:0;background:var(--bg);color:var(--tx);padding:11px 14px;margin-bottom:6px;border-radius:10px;font:inherit;cursor:pointer}
.mvb:hover{background:var(--ac2)}
</style>
</head>
<body>
<header>
  <h1><span>☁️</span><span id="title"></span></h1>
  <div class="search"><input id="q" type="search" placeholder="Tìm tệp trong thư mục này" aria-label="Tìm tệp"></div>
  <button class="dl" id="nf" hidden>📁 Thư mục mới</button>
  <button class="dl" id="adm">Quản trị</button>
  <button class="up" id="upbtn">Tải lên</button>
  <input type="file" id="upin" multiple hidden>
</header>
<main>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="list" id="list"></div>
  <div class="hint">Kéo thả tệp vào trang để tải lên. Mỗi tệp tối đa 20 MB.</div>
</main>
<div id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <div class="bar"><span class="nm" id="mname"></span><span class="tools" id="zt" hidden><button class="x" id="zout" title="Thu nhỏ" aria-label="Thu nhỏ">−</button><button class="x" id="zin" title="Phóng to" aria-label="Phóng to">+</button><button class="dl" id="zfit">Vừa khung</button><button class="dl" id="zfull">Cỡ gốc</button></span><button class="x" id="mfs" title="Toàn màn hình" aria-label="Toàn màn hình">⛶</button><button class="dl" id="mdl">Tải về</button><button class="x" id="mx" aria-label="Đóng">✕</button></div>
    <div class="view" id="view"></div>
  </div>
</div>
<div id="lg" class="ov" role="dialog" aria-modal="true"><div class="dbox">
  <h2>Đăng nhập quản trị</h2><p>Chỉ chủ kho mới xóa, chuyển tệp và tạo thư mục được.</p>
  <input id="lgem" type="email" placeholder="Email" autocomplete="username" aria-label="Email">
  <input id="lgpw" type="password" placeholder="Mật khẩu" autocomplete="current-password" aria-label="Mật khẩu">
  <div class="er" id="lger"></div>
  <div class="dbtn"><button class="x" id="lgno">Hủy</button><button class="dl" id="lgok">Đăng nhập</button></div>
</div></div>
<div id="mv" class="ov" role="dialog" aria-modal="true"><div class="dbox">
  <h2 id="mvt"></h2><div id="mvl"></div>
  <div class="dbtn"><button class="x" id="mvno">Hủy</button></div>
</div></div>
<div id="toast" aria-live="polite"></div>

<script>
/* ====== CẤU HÌNH ======
   Điền 2 giá trị lấy từ Supabase (Project Settings → API):
   supabaseUrl: Project URL, ví dụ https://abcdxyz.supabase.co
   anonKey:     khóa "anon public" (khóa này được thiết kế để công khai, dán vào đây là an toàn) */
const CONFIG = {
  title: "Kho tệp",
  supabaseUrl: "https://jphqnomjdgwjcgzudgyf.supabase.co",
  anonKey: "sb_publishable_L8g8niIjT5BDYe3akGZIOA_IJHoaw0Z",
  bucket: "files"
};

const $ = id => document.getElementById(id);
$("title").textContent = CONFIG.title; document.title = CONFIG.title;
const MAX = 20 * 1048576;
const BLOCKED = ["html","htm","xhtml","svg","js","mjs","php","exe","msi","bat","cmd","com","scr","ps1","sh","jar","apk","dll","vbs"];
const TYPES = {
  image:["jpg","jpeg","png","gif","webp","bmp","avif"],
  video:["mp4","webm","mov","m4v","ogv"],
  audio:["mp3","wav","ogg","m4a","flac","aac"],
  pdf:["pdf"],
  office:["doc","docx","xls","xlsx","ppt","pptx"],
  text:["txt","md","json","csv","log","css","xml","yml","yaml","py","cpp","c","h","java","cs","ini","sql","js","ts","jsx","tsx","go","rs","rb","kt","swift","toml","tex","srt","vtt","bat","sh"]
};
const ICON = {image:"🖼️",video:"🎬",audio:"🎵",pdf:"📕",office:"📊",text:"📄",other:"📦",dir:"📁"};
const ext = n => (n.split(".").pop() || "").toLowerCase();
const kind = n => Object.keys(TYPES).find(k => TYPES[k].includes(ext(n))) || "other";
const fmt = b => b < 1024 ? b + " B" : b < 1048576 ? (b/1024).toFixed(1) + " KB" : (b/1048576).toFixed(1) + " MB";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const enc = p => p.split("/").map(encodeURIComponent).join("/");

const API = CONFIG.supabaseUrl.replace(/\/$/, "") + "/storage/v1/object";
const AUTH = CONFIG.anonKey.startsWith("eyJ")
  ? { apikey: CONFIG.anonKey, Authorization: "Bearer " + CONFIG.anonKey }
  : { apikey: CONFIG.anonKey }; /* khóa sb_publishable_… chỉ cần gửi qua apikey */
const pubUrl = p => `${API}/public/${CONFIG.bucket}/${enc(p)}`;

let items = [];
const sub = () => decodeURIComponent(location.hash.replace(/^#\/?/, "")).replace(/\/+$/, "");

function toast(t, keep) {
  const d = document.createElement("div"); d.textContent = t; $("toast").appendChild(d);
  if (!keep) setTimeout(() => d.remove(), 5000);
  return d;
}
function msg(t, d) { $("list").innerHTML = `<div class="msg"><b>${t}</b>${d}</div>`; }

async function load() {
  const s = sub();
  renderCrumbs(s); $("q").value = "";
  if (!CONFIG.supabaseUrl || !CONFIG.anonKey) return msg("Chưa cấu hình", "Điền supabaseUrl và anonKey trong phần CONFIG ở đầu file index.html.");
  $("list").innerHTML = '<div class="msg">Đang tải…</div>';
  try {
    await ensure();
    const r = await fetch(`${API}/list/${CONFIG.bucket}`, {
      method: "POST", headers: { ...hdr(), "Content-Type": "application/json" },
      body: JSON.stringify({ prefix: s, limit: 1000, offset: 0, sortBy: { column: "name", order: "asc" } })
    });
    if (!r.ok) throw 0;
    items = (await r.json()).filter(f => f.name !== ".emptyFolderPlaceholder").map(f => {
      const path = (s ? s + "/" : "") + f.name;
      return { name: f.name, type: f.id ? "file" : "dir", size: (f.metadata && f.metadata.size) || 0, download_url: pubUrl(path), path };
    }).sort((a, b) => (a.type === "dir" ? 0 : 1) - (b.type === "dir" ? 0 : 1) || a.name.localeCompare(b.name, "vi", { numeric: true }));
    render();
  } catch (e) { msg("Không tải được danh sách", "Kiểm tra supabaseUrl, anonKey và đã chạy đoạn SQL cấp quyền chưa."); }
}

function renderCrumbs(s) {
  const parts = s ? s.split("/") : [];
  let acc = "", h = `<a href="#/" data-p="">${esc(CONFIG.title)}</a>`;
  parts.forEach(p => { acc += (acc ? "/" : "") + p; h += ` › <a href="#/${enc(acc)}" data-p="${esc(acc)}">${esc(p)}</a>`; });
  $("crumbs").innerHTML = h;
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const rows = items.filter(f => f.name.toLowerCase().includes(q));
  if (!rows.length) return msg(q ? "Không có tệp khớp" : "Chưa có tệp nào", q ? "Thử từ khóa khác." : "Bấm Tải lên hoặc kéo thả tệp vào đây.");
  $("list").innerHTML = rows.map(f => {
    const dir = f.type === "dir", k = dir ? "dir" : kind(f.name);
    return `<div class="item" tabindex="0" data-n="${esc(f.name)}" data-t="${f.type}"${S ? ' draggable="true"' : ""}><span class="ic">${ICON[k]}</span><span class="nm">${esc(f.name)}</span>` +
      (dir ? "" : `<span class="sz">${fmt(f.size)}</span><button class="dl" data-d="1">Tải về</button>`) +
      (S ? `<button class="dl" data-m="1">Chuyển</button><button class="dl del" data-x="1">Xóa</button>` : "") + `</div>`;
  }).join("");
}

$("list").addEventListener("click", e => {
  const el = e.target.closest(".item"); if (!el) return;
  const f = items.find(x => x.name === el.dataset.n);
  if (e.target.closest("[data-d]")) { e.stopPropagation(); return download(f, e.target.closest("[data-d]")); }
  if (e.target.closest("[data-x]")) return removeItem(f);
  if (e.target.closest("[data-m]")) return showMove(f);
  openFile(f);
});
$("list").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList.contains("item")) e.target.click(); });
$("q").addEventListener("input", render);
addEventListener("hashchange", load);

async function download(f, btn) {
  const old = btn ? btn.textContent : "";
  if (btn) btn.textContent = "Đang tải…";
  try {
    const blob = await (await fetch(f.download_url)).blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { window.open(f.download_url, "_blank"); }
  if (btn) btn.textContent = old;
}

let cur = null, blobUrl = null, Z = null;
const OFFICE = u => "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(u);
function fail(v) {
  v.className = "view"; $("zt").hidden = true;
  v.innerHTML = '<div class="msg"><b>Không xem trước được tệp này</b>Bấm “Tải về” để lưu vào máy.</div>';
}
async function openFile(f) {
  if (f.type === "dir") { location.hash = "#/" + enc([sub(), f.name].filter(Boolean).join("/")); return; }
  cur = f; Z = null; const k = kind(f.name), v = $("view");
  $("mname").textContent = f.name; $("zt").hidden = true; v.className = "view";
  v.innerHTML = '<div class="msg">Đang mở…</div>';
  $("modal").classList.add("on");
  try {
    if (k === "image") return showImage(f, v);
    if (k === "video") { v.innerHTML = `<video src="${f.download_url}" controls autoplay playsinline></video>`; v.firstChild.onerror = () => fail(v); }
    else if (k === "audio") { v.innerHTML = `<audio src="${f.download_url}" controls autoplay></audio>`; v.firstChild.onerror = () => fail(v); }
    else if (k === "pdf") {
      const b = await (await fetch(f.download_url)).blob();
      blobUrl = URL.createObjectURL(new Blob([b], { type: "application/pdf" }));
      v.innerHTML = `<iframe src="${blobUrl}" title="${esc(f.name)}"></iframe>`;
    } else if (k === "office") v.innerHTML = `<iframe src="${OFFICE(f.download_url)}" title="${esc(f.name)}"></iframe>`;
    else if (k === "text") {
      if (f.size > 1048576) throw 0;
      v.innerHTML = `<pre>${esc(await (await fetch(f.download_url)).text())}</pre>`;
    } else fail(v);
  } catch (e) { fail(v); }
}

/* Ảnh: lăn chuột / chụm hai ngón để phóng to, kéo để di chuyển, bấm đúp để phóng 3 lần */
function showImage(f, v) {
  v.className = "view img";
  v.innerHTML = `<img alt="${esc(f.name)}" draggable="false">`;
  const im = v.firstChild; Z = { s: 1, x: 0, y: 0, im };
  im.onerror = () => fail(v);
  im.onload = () => { $("zt").hidden = false; };
  im.src = f.download_url;
}
const apply = () => { if (Z) Z.im.style.transform = `translate(${Z.x}px,${Z.y}px) scale(${Z.s})`; };
function zoomAt(ns, cx, cy) {
  ns = Math.min(30, Math.max(0.2, ns));
  Z.x = cx - (cx - Z.x) * ns / Z.s; Z.y = cy - (cy - Z.y) * ns / Z.s; Z.s = ns; apply();
}
const rel = (x, y) => { const r = $("view").getBoundingClientRect(); return [x - r.left - r.width / 2, y - r.top - r.height / 2]; };
const pts = new Map(); let pinch = 0;
$("view").addEventListener("wheel", e => { if (!Z) return; e.preventDefault(); const [cx, cy] = rel(e.clientX, e.clientY); zoomAt(Z.s * (e.deltaY < 0 ? 1.18 : 1 / 1.18), cx, cy); }, { passive: false });
$("view").addEventListener("pointerdown", e => { if (!Z) return; pts.set(e.pointerId, [e.clientX, e.clientY]); $("view").setPointerCapture(e.pointerId); pinch = 0; });
$("view").addEventListener("pointermove", e => {
  if (!Z || !pts.has(e.pointerId)) return;
  const p = pts.get(e.pointerId);
  if (pts.size === 1) { Z.x += e.clientX - p[0]; Z.y += e.clientY - p[1]; apply(); }
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) { const [cx, cy] = rel((a[0] + b[0]) / 2, (a[1] + b[1]) / 2); zoomAt(Z.s * d / pinch, cx, cy); }
    pinch = d;
  }
});
const endPt = e => { pts.delete(e.pointerId); pinch = 0; };
$("view").addEventListener("pointerup", endPt); $("view").addEventListener("pointercancel", endPt);
$("view").addEventListener("dblclick", e => {
  if (!Z) return;
  if (Z.s > 1.05) { Z.s = 1; Z.x = Z.y = 0; apply(); } else { const [cx, cy] = rel(e.clientX, e.clientY); zoomAt(3, cx, cy); }
});
$("zin").onclick = () => Z && zoomAt(Z.s * 1.4, 0, 0);
$("zout").onclick = () => Z && zoomAt(Z.s / 1.4, 0, 0);
$("zfit").onclick = () => { if (Z) { Z.s = 1; Z.x = Z.y = 0; apply(); } };
$("zfull").onclick = () => { if (Z) { Z.x = Z.y = 0; Z.s = Z.im.naturalWidth / Z.im.clientWidth; apply(); } };

if (!document.fullscreenEnabled) $("mfs").hidden = true;
$("mfs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : $("modal").requestFullscreen();

function closeModal() {
  if (document.fullscreenElement) document.exitFullscreen();
  $("modal").classList.remove("on"); $("view").innerHTML = ""; Z = null; pts.clear();
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
}
$("mx").onclick = closeModal;
$("mdl").onclick = e => cur && download(cur, e.target);
addEventListener("keydown", e => { if (e.key === "Escape" && $("modal").classList.contains("on") && !document.fullscreenElement) closeModal(); });

/* ====== TẢI LÊN ======
   Tên tệp được đổi sang chữ không dấu (a-z, 0-9, . _ -) vì Supabase chỉ chấp nhận ký tự an toàn. */
const clean = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").replace(/[^A-Za-z0-9._-]+/g, "_").replace(/^_+|_+$/g, "");
function safeName(n) {
  const i = n.lastIndexOf(".");
  const base = i > 0 ? n.slice(0, i) : n, ex = i > 0 ? n.slice(i) : "";
  return (clean(base) || "tep") + clean(ex);
}

async function uploadFiles(files) {
  files = [...files];
  if (!files.length) return;
  if (!CONFIG.supabaseUrl || !CONFIG.anonKey) return toast("Chưa cấu hình Supabase trong CONFIG.");
  await ensure();
  let done = 0;
  for (const f of files) {
    if (f.size > MAX) { toast(`${f.name}: lớn hơn 20 MB nên không tải lên được`); continue; }
    if (BLOCKED.includes(ext(f.name))) { toast(`${f.name}: loại tệp này không được phép tải lên`); continue; }
    if (!f.size) { toast(`${f.name}: tệp trống`); continue; }
    const t = toast(`Đang tải lên ${f.name}…`, true);
    const first = safeName(f.name);
    let name = first, n = 0;
    try {
      for (;;) { /* không ghi đè: nếu trùng tên thì thêm _1, _2… */
        const path = (sub() ? sub() + "/" : "") + name;
        const r = await fetch(`${API}/${CONFIG.bucket}/${enc(path)}`, {
          method: "POST", body: f,
          headers: { ...hdr(), "Content-Type": f.type || "application/octet-stream", "x-upsert": "false", "cache-control": "max-age=3600" }
        });
        if (r.ok) break;
        const j = await r.json().catch(() => ({}));
        if (j.error === "Duplicate" || String(j.statusCode) === "409" || r.status === 409) {
          if (++n > 50) throw new Error("Quá nhiều tệp trùng tên");
          name = first.replace(/(\.[^.]*)?$/, `_${n}$1`); continue;
        }
        if (r.status === 413) throw new Error(`${f.name}: lớn hơn giới hạn của kho`);
        throw new Error(`Lỗi ${r.status}: ${j.message || j.error || "không rõ nguyên nhân"}`);
      }
      t.textContent = `Đã tải lên ${name}`; setTimeout(() => t.remove(), 4000); done++;
    } catch (e) { t.textContent = e.message || `Không tải lên được ${f.name}`; }
  }
  if (done) load();
}
$("upbtn").onclick = () => $("upin").click();
$("upin").onchange = e => { uploadFiles(e.target.files); e.target.value = ""; };
let dragN = 0;
addEventListener("dragenter", e => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) { dragN++; document.body.classList.add("drag"); } });
addEventListener("dragleave", () => { if (--dragN <= 0) { dragN = 0; document.body.classList.remove("drag"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); dragN = 0; document.body.classList.remove("drag"); if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });

/* ====== QUẢN TRỊ: đăng nhập, xóa, tạo thư mục, chuyển tệp ====== */
const KEY = CONFIG.anonKey, SB = CONFIG.supabaseUrl.replace(/\/$/, "");
let S = null; try { S = JSON.parse(localStorage.getItem("kt-session")); } catch (e) {}
function ui() { $("adm").textContent = S ? "Đăng xuất" : "Quản trị"; $("nf").hidden = !S; }
function saveS(v) { S = v; try { v ? localStorage.setItem("kt-session", JSON.stringify(v)) : localStorage.removeItem("kt-session"); } catch (e) {} ui(); }
const hdr = () => S ? { apikey: KEY, Authorization: "Bearer " + S.access_token } : AUTH;
async function authReq(body, grant) {
  const r = await fetch(`${SB}/auth/v1/token?grant_type=${grant}`, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || "Đăng nhập không thành công");
  return { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now() / 1000) + j.expires_in, email: (j.user && j.user.email) || "" };
}
async function ensure() {
  if (S && S.expires_at - 60 < Date.now() / 1000) {
    try { saveS(await authReq({ refresh_token: S.refresh_token }, "refresh_token")); }
    catch (e) { saveS(null); toast("Phiên quản trị đã hết hạn, hãy đăng nhập lại."); }
  }
}
const errMsg = async r => { const j = await r.json().catch(() => ({})); return `Lỗi ${r.status}: ${j.message || j.error || "không rõ nguyên nhân"}`; };
const post = (url, body) => fetch(url, { method: "POST", headers: { ...hdr(), "Content-Type": "application/json" }, body: JSON.stringify(body) });

$("adm").onclick = () => { if (S) { saveS(null); load(); } else { $("lg").classList.add("on"); $("lgem").focus(); } };
$("lgno").onclick = () => $("lg").classList.remove("on");
$("lgok").onclick = async () => {
  $("lger").textContent = "";
  try {
    saveS(await authReq({ email: $("lgem").value.trim(), password: $("lgpw").value }, "password"));
    $("lg").classList.remove("on"); $("lgpw").value = ""; load();
  } catch (e) { $("lger").textContent = e.message; }
};
$("lgpw").addEventListener("keydown", e => { if (e.key === "Enter") $("lgok").click(); });

async function listAll(prefix) {
  const r = await post(`${API}/list/${CONFIG.bucket}`, { prefix, limit: 1000, offset: 0 });
  if (!r.ok) throw new Error(await errMsg(r));
  const out = [];
  for (const o of await r.json()) { const p = prefix + "/" + o.name; if (o.id) out.push(p); else out.push(...await listAll(p)); }
  return out;
}

async function removeItem(f) {
  if (!confirm(f.type === "dir" ? `Xóa thư mục “${f.name}” và toàn bộ tệp bên trong?` : `Xóa tệp “${f.name}”?`)) return;
  const t = toast("Đang xóa…", true);
  try {
    await ensure();
    const paths = f.type === "dir" ? await listAll(f.path) : [f.path];
    let gone = 0;
    for (let i = 0; i < paths.length; i += 100) {
      const r = await fetch(`${API}/${CONFIG.bucket}`, { method: "DELETE", headers: { ...hdr(), "Content-Type": "application/json" }, body: JSON.stringify({ prefixes: paths.slice(i, i + 100) }) });
      if (!r.ok) throw new Error(await errMsg(r));
      gone += (await r.json().catch(() => [])).length || 0;
    }
    if (paths.length && !gone) throw new Error("Không có quyền xóa. Kiểm tra đã chạy SQL quyền quản trị và đăng nhập đúng email chưa.");
    t.textContent = "Đã xóa"; setTimeout(() => t.remove(), 3000); load();
  } catch (e) { t.textContent = e.message || "Không xóa được"; }
}

async function moveTo(f, destDir) {
  const dest = (destDir ? destDir + "/" : "") + f.name;
  if (dest === f.path) return;
  if (f.type === "dir" && (destDir === f.path || destDir.startsWith(f.path + "/"))) return toast("Không thể chuyển thư mục vào chính nó");
  const t = toast(`Đang chuyển ${f.name}…`, true);
  try {
    await ensure();
    const files = f.type === "dir" ? await listAll(f.path) : [f.path];
    for (const p of files) {
      const r = await post(`${API}/move`, { bucketId: CONFIG.bucket, sourceKey: p, destinationKey: dest + p.slice(f.path.length) });
      if (!r.ok) throw new Error(await errMsg(r));
    }
    t.textContent = `Đã chuyển ${f.name}`; setTimeout(() => t.remove(), 3000); load();
  } catch (e) { t.textContent = e.message || "Không chuyển được"; }
}

let mvF = null, mvD = [];
function showMove(f) {
  mvD = [];
  if (sub()) { mvD.push({ l: "🏠 Thư mục gốc", p: "" }); mvD.push({ l: "⬆ Thư mục trên", p: sub().split("/").slice(0, -1).join("/") }); }
  items.filter(x => x.type === "dir" && x.path !== f.path).forEach(x => mvD.push({ l: "📁 " + x.name, p: x.path }));
  if (!mvD.length) return toast("Chưa có thư mục nào để chuyển vào. Hãy tạo thư mục trước.");
  mvF = f; $("mvt").textContent = `Chuyển “${f.name}” đến:`;
  $("mvl").innerHTML = mvD.map((d, i) => `<button class="mvb" data-i="${i}">${esc(d.l)}</button>`).join("");
  $("mv").classList.add("on");
}
$("mvl").onclick = e => { const b = e.target.closest("[data-i]"); if (b) { $("mv").classList.remove("on"); moveTo(mvF, mvD[+b.dataset.i].p); } };
$("mvno").onclick = () => $("mv").classList.remove("on");

$("nf").onclick = async () => {
  const raw = prompt("Tên thư mục mới (sẽ được đổi thành chữ không dấu):");
  const name = raw && clean(raw.trim());
  if (!name) { if (raw) toast("Tên thư mục không hợp lệ"); return; }
  const t = toast("Đang tạo thư mục…", true);
  try {
    await ensure();
    const path = (sub() ? sub() + "/" : "") + name + "/.emptyFolderPlaceholder";
    const r = await fetch(`${API}/${CONFIG.bucket}/${enc(path)}`, { method: "POST", body: new Blob([" "]), headers: { ...hdr(), "Content-Type": "application/octet-stream", "x-upsert": "false" } });
    if (!r.ok) { const j = await r.json().catch(() => ({})); if (!(j.error === "Duplicate" || String(j.statusCode) === "409")) throw new Error(await errMsg(r)); }
    t.textContent = `Đã tạo thư mục ${name}`; setTimeout(() => t.remove(), 3000); load();
  } catch (e) { t.textContent = e.message || "Không tạo được thư mục"; }
};

/* Kéo tệp hoặc thư mục thả vào thư mục khác (hoặc vào thanh đường dẫn phía trên) */
let dragF = null;
const clearOver = () => document.querySelectorAll(".over").forEach(x => x.classList.remove("over"));
$("list").addEventListener("dragstart", e => {
  const el = e.target.closest(".item"); if (!el || !S) return;
  dragF = items.find(x => x.name === el.dataset.n);
  e.dataTransfer.setData("text/plain", dragF.name); e.dataTransfer.effectAllowed = "move";
});
$("list").addEventListener("dragend", () => { dragF = null; clearOver(); });
$("list").addEventListener("dragover", e => {
  const el = e.target.closest('.item[data-t="dir"]');
  if (dragF && el && el.dataset.n !== dragF.name) { e.preventDefault(); clearOver(); el.classList.add("over"); }
});
$("list").addEventListener("drop", e => {
  const el = e.target.closest('.item[data-t="dir"]');
  if (dragF && el) { e.preventDefault(); clearOver(); const d = items.find(x => x.name === el.dataset.n); if (d && d.path !== dragF.path) moveTo(dragF, d.path); }
});
$("crumbs").addEventListener("dragover", e => { const a = e.target.closest("a[data-p]"); if (dragF && a) { e.preventDefault(); clearOver(); a.classList.add("over"); } });
$("crumbs").addEventListener("drop", e => { const a = e.target.closest("a[data-p]"); if (dragF && a) { e.preventDefault(); clearOver(); moveTo(dragF, a.dataset.p); } });

ui();

load();
</script>
